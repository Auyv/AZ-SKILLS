# SDD 状态定义
# 所有 SKILL 必须引用此文件定义的状态

states:
  - id: draft
    name: 草稿
    icon: "📋"
    description: 规范文档已创建，待审核
    color: gray

  - id: reviewing
    name: 审核中
    icon: "👁️"
    description: 规范正在审核，等待确认
    color: yellow

  - id: approved
    name: 已批准
    icon: "✅"
    description: 规范审核通过，可以开始开发
    color: green

  - id: developing
    name: 开发中
    icon: "🔨"
    description: 正在按照规范实现
    color: blue

  - id: testing
    name: 测试中
    icon: "🧪"
    description: 代码编写完成，正在测试验证
    color: orange

  - id: acceptance
    name: 待验收
    icon: "🎯"
    description: 测试完成，等待用户验收确认
    color: purple

  - id: completed
    name: 已完成
    icon: "✅"
    description: 用户验收通过
    color: green

  - id: released
    name: 已发布
    icon: "🚀"
    description: 功能已正式发布
    color: green

  - id: blocked
    name: 阻塞
    icon: "🚧"
    description: 遇到阻塞问题，需要解决
    color: red

# 状态转换规则
transitions:
  draft:
    - reviewing      # 提交审核
    - blocked       # 发现问题

  reviewing:
    - approved      # 审核通过
    - draft         # 审核拒绝，返回修改
    - blocked       # 发现阻塞问题

  approved:
    - developing    # 开始开发

  developing:
    - testing       # 开发完成，开始测试
    - blocked       # 发现问题

  testing:
    - acceptance    # 测试通过，等待验收
    - developing    # 测试失败，返回开发
    - blocked       # 发现严重问题

  acceptance:
    - completed     # 验收通过
    - developing    # 验收不通过，返回开发

  completed:
    - released      # 正式发布

# 状态可回退吗？
# 默认不允许回退，但 acceptance -> developing 是允许的（验收不通过）
allow_backward:
  - [acceptance, developing]

# 全局状态查询
query_rules:
  # 查询"进行中"的状态
  in_progress:
    - reviewing
    - developing
    - testing
    - acceptance

  # 查询"已完成"的状态
  done:
    - completed
    - released

  # 查询"异常"的状态
  abnormal:
    - blocked

# 反馈闭环状态定义
feedback_states:
  - id: clarifying
    name: 待澄清
    description: 已记录反馈，但关键信息不足
    open: true

  - id: planned
    name: 已计划
    description: 已完成分类并生成处理计划
    open: true

  - id: processing
    name: 处理中
    description: 正在修复、改规范、重构或验证
    open: true

  - id: verifying
    name: 待验证
    description: 已处理，等待自动化测试或人工确认
    open: true

  - id: resolved
    name: 已解决
    description: 验证通过或用户确认问题解决
    open: false

  - id: closed
    name: 已关闭
    description: 不处理、重复或无效，且已记录原因
    open: false

  - id: repro_pending
    name: 待复现
    description: 暂无法复现，等待补充复现条件
    open: true

  - id: transferred
    name: 转需求
    description: 已转成新/改 spec，后续跟踪关联规范
    open: true

feedback_next_actions:
  - id: spec
    description: 创建或更新功能规范
  - id: arch
    description: 创建或更新技术规范
  - id: coder
    description: 修复实现缺陷或执行重构
  - id: tester
    description: 执行测试验收或异常处理
  - id: none
    description: 无需执行阶段动作，记录关闭或待复现原因

# 状态写入规则
# STATUS.md 是当前态入口，TRACK.md 是历史事件日志
sync_rules:
  description: |
    状态管理采用“一个状态看板 + 多文档证据”。
    每次阶段推进时，优先更新 STATUS.md 作为当前态入口；
    SPEC.md、ARCH.md、FEEDBACK.md 只保留索引和链接；
    TRACK.md 只追加关键事件，不承担状态总览职责。

  files_to_update:
    - name: STATUS.md
      path: az-sdd/STATUS.md
      description: 当前状态看板，展示阶段、进度、焦点、阻塞、未闭环反馈和下一步
      mandatory: true

    - name: SPEC.md
      path: az-sdd/SPEC.md
      description: 功能规范索引，只保留功能列表、状态、链接和简短备注
      mandatory: true

    - name: coding.md
      path: az-sdd/coding.md
      description: 批量开发计划证据，不作为全局状态入口
      mandatory: false
      condition: "仅在批量开发模式时存在"

    - name: ARCH.md
      path: az-sdd/ARCH.md
      description: 技术规范索引，只保留架构文档列表和关联功能
      mandatory: false

    - name: FEEDBACK.md
      path: az-sdd/FEEDBACK.md
      description: 反馈索引，只保留反馈列表、状态、下一步动作和链接
      mandatory: true
      condition: "仅当存在反馈记录时"

    - name: TRACK.md
      path: az-sdd/TRACK.md
      description: 历史事件日志，只追加关键状态变化、阻塞、关闭和发布记录
      mandatory: false

  # 写入触发时机
  trigger_points:
    - skill: az-sdd-spec
      triggers:
        - "规范创建时（draft）"
        - "状态变更时（draft → reviewing → approved）"
      files:
        - STATUS.md
        - SPEC.md
        - TRACK.md（仅关键事件）

    - skill: az-sdd-coder
      triggers:
        - "开始开发时（approved → developing）"
        - "开发完成时（developing → testing）"
        - "测试通过时（testing → acceptance）"
      files:
        - STATUS.md
        - SPEC.md
        - coding.md
        - TRACK.md（仅关键事件）

    - skill: az-sdd-tester
      triggers:
        - "验收通过时（acceptance → completed）"
      files:
        - STATUS.md
        - SPEC.md
        - coding.md
        - TRACK.md（仅关键事件）

    - skill: az-sdd-feedback
      triggers:
        - "反馈创建时（待澄清/已计划）"
        - "反馈分流时（已计划 → 处理中/转需求/待复现）"
        - "反馈验证时（处理中 → 待验证 → 已解决）"
        - "反馈关闭时（任意状态 → 已关闭/已解决/待复现/转需求）"
      files:
        - STATUS.md
        - FEEDBACK.md
        - TRACK.md（仅关闭、挂起、阻塞或高优先级事件）

    - skill: az-sdd-track
      triggers:
        - "查看或更新当前状态时"
        - "发布时（completed → released）"
      files:
        - STATUS.md
        - SPEC.md
        - ARCH.md
        - FEEDBACK.md
        - TRACK.md（仅事件日志）

  # 写入检查清单
  checklist:
    - name: 状态入口完整性
      check: "STATUS.md 是否能在第一屏看到当前阶段、当前工作、阻塞项和下一步"

    - name: 索引轻量性
      check: "SPEC.md、ARCH.md、FEEDBACK.md 是否只保留索引、状态、链接和简短备注"

    - name: 证据可追踪
      check: "STATUS.md 中的当前焦点是否链接到 spec、coder、tester 或 feedback 证据"

    - name: 历史日志克制
      check: "TRACK.md 是否只追加关键事件，而不是重复维护状态总览"

  # 常见不一致问题及处理
  common_issues:
    - symptom: "用户无法一眼判断下一步"
      cause: "STATUS.md 未更新或当前焦点不清晰"
      fix: "先更新 STATUS.md，再补充相关证据链接"

    - symptom: "多个文件都在维护完整状态"
      cause: "索引或日志承担了状态看板职责"
      fix: "将当前态收敛到 STATUS.md，其他文件降级为索引或证据"

    - symptom: "TRACK.md 内容越来越像日报或看板"
      cause: "把历史日志当成状态总览使用"
      fix: "保留关键事件，当前态迁移到 STATUS.md"
