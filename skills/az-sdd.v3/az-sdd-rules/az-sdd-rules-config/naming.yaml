# SDD 命名规范
# 定义文件命名、编号等规范

# 项目档案目录结构
project_structure:
  root: az-sdd
  files:
    - name: init.md
      description: 项目初始化信息
      required: true

    - name: track.md
      description: 工作状态追踪记录
      required: true

    - name: SPEC.md
      description: 功能规范索引目录
      required: true

    - name: ARCH.md
      description: 技术规范索引目录
      required: true

    - name: FEEDBACK.md
      description: 用户反馈索引目录
      required: true

  directories:
    - name: spec
      description: 功能规范文档目录
      pattern: "*.spec.md"

    - name: arch
      description: 技术规范文档目录
      pattern: "*.arch.md"

    - name: test
      description: 测试相关文件目录
      subdirs:
        - cases        # 测试用例
        - reports      # 测试报告
        - manuals     # 操作手册

    - name: feedback
      description: 用户反馈文档目录
      pattern: "FB-*.feedback.md"

# 功能规范文件命名
spec_file:
  pattern: "{ID}-{MODULE}-{NAME}.spec.md"
  example: "0001-task-creation.spec.md"
  id_format: "NNNN"
  id_start: 1
  id_padding: 4

# 技术规范文件命名
arch_file:
  pattern: "{ID}-{MODULE}-{NAME}.arch.md"
  example: "0001-tech-stack.arch.md"
  id_format: "NNNN"
  # 保留编号
  reserved_ids:
    - "0001"  # 技术栈选型（全局）
    - "0002"  # 数据模型（全局）

# 反馈文件命名
feedback_file:
  pattern: "FB-{YEAR}-{SEQ}.feedback.md"
  example: "FB-2026-0001.feedback.md"
  seq_format: "NNNN"
  seq_start: 1
  reset_yearly: true

# 测试文件命名
test_file:
  pattern: "{SPEC_ID}-{NAME}.test.{ext}"
  example: "0001-task-creation.test.ts"
  manual_pattern: "{SPEC_ID}-{NAME}.manual.md"
  report_pattern: "{SPEC_ID}-{NAME}-REPORT.md"
  manual_pattern_report: "{SPEC_ID}-{NAME}-MANUAL.md"

# Commit 规范
commit:
  format: "{TYPE}: {SUMMARY}\n\n{BODY}\n\n{Closes}"
  types:
    - feat       # 新功能
    - fix        # 修复bug
    - refactor   # 重构
    - docs       # 文档更新
    - test       # 测试相关
    - chore     # 杂项

# 编号分配规则
id_allocation:
  # 保留编号段
  reserved:
    "0001-0009": 全局技术规范（技术栈、数据模型等）
    "0010-0099": 核心功能
    "0100+":     普通功能

  # 按模块分配编号段
  modules:
    task:
      range: "0001-0099"
      description: 任务管理相关

    user:
      range: "0100-0199"
      description: 用户管理相关

    report:
      range: "0200-0299"
      description: 报表相关

    settings:
      range: "9900-9999"
      description: 系统设置相关
