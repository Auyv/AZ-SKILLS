; 嵌入式C项目配置文件模板
; 部署路径根据项目实际配置，如: /vendor/app/hq/etc/nfupgrade_cfg.ini

[log]
; 日志配置
file_dir = /media/card/log/upgrade/
file_tag = nfupgrade
file_size = 1048576
file_count = 5

[upgrade]
; 升级文件路径
img_file = /media/card/nfxx_upgrade.img
se_img_file = /media/card/se_nfxx_upgrade.img
mpu_file = /media/card/quectel_AB_OTA.img
partition_record = /media/card/log/upgrade/before_upgrade_partition

[net_upgrade]
; 网络升级配置
enable = 1
url_format = http://%s:%d/%s
pem_keys_dir = /vendor/data/tee/upgrade/key/
srt_id_addr = 471
srt_id_port = 472
srt_id_file = 473
