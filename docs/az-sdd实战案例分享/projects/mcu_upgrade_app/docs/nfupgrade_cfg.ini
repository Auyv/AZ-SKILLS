; MCU 升级应用配置文件
; 当此文件不存在时，使用编译时默认值
; 部署路径: /vendor/app/hq/etc/nfupgrade_cfg.ini

[log]
; 日志配置
file_dir = /media/card/log/upgrade/
file_tag = nfupgrade
file_size = 1048576
file_count = 5

[nf_upgrade]
; NFCREATE 升级文件配置
img_file = /media/card/nfxx_upgrade.img
se_img_file = /media/card/se_nfxx_upgrade.img

[mpu_upgrade]
; MPU 升级文件配置
upgrade_file = /media/card/quectel_AB_OTA.img
partition_record_file = /media/card/log/upgrade/before_upgrade_partition

[net_upgrade]
; 网络升级配置
enable = 1
url_format = http://%s:%d/%s
pem_keys_dir = /vendor/data/tee/upgrade/key/
srt_id_addr = 471
srt_id_port = 472
srt_id_file = 473

[upgrade]
; MCU/MPU 升级使能配置
; 0: 关闭, 非0: 开启
mcu_upgrade_enable = 1
mpu_upgrade_enable = 1
